<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --line: #262935; --text: #e7e8ee; --muted: #8b8fa3;
    --accent: #ff4f9a; --accent-2: #ffb36b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 10px; font-size: 18px; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  input[type=search] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 8px 6px; }
  .section-h h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
  .section-h button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .section-h button:hover { color: var(--text); }
  #regions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 8px; }
  .reg { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; line-height: 1.2;
    transition: border-color .15s, background .15s, opacity .15s; }
  .reg i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .reg small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .reg:hover { border-color: var(--c); }
  .reg.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  #regions.filtering .reg:not(.on) { opacity: .5; }
  #scroll { overflow-y: auto; flex: 1; padding-bottom: 16px; }
  #cats { padding: 0 8px; }
  .group { margin-top: 8px; }
  .group h3 { font-size: 11px; color: var(--muted); margin: 6px 8px 2px; font-weight: 500; }
  label.cat { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; user-select: none; }
  label.cat:hover { background: #1d2029; }
  label.cat input { accent-color: var(--accent); margin: 0; }
  label.cat img { width: 20px; height: 20px; object-fit: contain; }
  label.cat .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  label.cat.empty { opacity: .4; }
  #results { border-bottom: 1px solid var(--line); max-height: 40%; overflow-y: auto; display: none; }
  #results.on { display: block; }
  #results button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 7px 14px; border: 0; background: none; color: var(--text); font: inherit; cursor: pointer; }
  #results button:hover { background: #1d2029; }
  #results img { width: 18px; height: 18px; }
  #results small { color: var(--muted); margin-left: auto; }

  .mapcol { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; position: relative; }
  #map { background: #0b2a3a; min-height: 0; }
  /* Region details drawer */
  #drawer { --c: #fff; background: var(--panel); border-top: 2px solid var(--c); box-shadow: 0 -10px 30px -10px color-mix(in srgb, var(--c) 45%, transparent);
    max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  #drawer.open { max-height: 46vh; overflow-y: auto; }
  .dw { display: grid; grid-template-columns: 260px 1fr 1fr; gap: 22px; padding: 18px 22px 20px; position: relative; }
  .dw img.pc { width: 100%; border-radius: 10px; display: block; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .dw h2 { margin: 0; font-size: 22px; letter-spacing: .01em; }
  .dw .tag { color: var(--c); font-style: italic; margin: 2px 0 2px; }
  .dw .rw { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .dw ul.sum { margin: 0; padding-left: 18px; color: #c9cbd6; }
  .dw ul.sum li { margin: 4px 0; }
  .dw h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 5px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--c); }
  .chip.only { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--bg)); }
  .chip img { width: 16px; height: 16px; }
  .chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .keys button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border: 0; border-radius: 6px; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; min-width: 0; }
  .keys button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys button:hover { background: #1d2029; }
  .keys img { width: 16px; height: 16px; flex: none; }
  .dw .x { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
  .dw .x:hover { color: var(--text); }
  #details-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 800; display: none;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--c, var(--line)); background: rgba(22,24,31,.92); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #details-btn.show { display: block; }
  @media (max-width: 1000px) { .dw { grid-template-columns: 200px 1fr; } .dw .col3 { grid-column: 1 / -1; } }
  @media (max-width: 720px) { .dw { grid-template-columns: 1fr; } .dw img.pc { max-width: 280px; } .keys { grid-template-columns: 1fr; } }
  /* Region overlay */
  .rg-glow { filter: blur(5px); transition: stroke-opacity .25s, fill-opacity .25s; }
  .rg-fill { transition: fill-opacity .25s, stroke-opacity .25s; }
  .veil { transition: fill-opacity .25s; }
  .region-label { color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%);
    text-shadow: 0 0 4px #000, 0 0 12px var(--c, #000); transition: opacity .25s; }
  .region-label.dim { opacity: .25; }
  /* Markers */
  .poi { background: none; border: 0; display: flex; align-items: center; justify-content: center; }
  .poi img { width: var(--poi, 100%); height: var(--poi, 100%); display: block; transition: transform .12s ease, filter .12s ease; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .poi:hover img { transform: scale(1.35); filter: drop-shadow(0 0 6px #fff); }
  .poi.sel img { transform: scale(1.45); filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px var(--accent)); }
  .poi:hover, .poi.sel { z-index: 10000 !important; }
  .leaflet-tooltip.tip { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: 12.5px; padding: 4px 8px; }
  .leaflet-tooltip.tip::before { border-top-color: var(--line); }
  .leaflet-tooltip.tip small { color: var(--muted); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-popup-content { margin: 12px 14px; }
  .pop b { display: block; font-size: 14px; margin-bottom: 2px; }
  .pop .meta { color: var(--muted); font-size: 12px; }
  .pop .meta i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 2px; background: var(--c); }
  .pop p { margin: 8px 0 0; }
  .pop code { color: var(--muted); font-size: 11px; }
  .coords { background: rgba(14,15,19,.8); color: var(--muted); padding: 3px 8px; border-radius: 4px; font: 12px ui-monospace, monospace; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Leonida Map</h1>
      <input id="q" type="search" placeholder="Search 425 locations…" autocomplete="off">
    </header>
    <div id="results"></div>
    <div id="scroll">
      <div class="section-h"><h2>Regions</h2><button id="regAll">Clear</button></div>
      <div id="regions"></div>
      <div class="section-h"><h2>Locations</h2><span><button id="all">All</button> · <button id="none">None</button></span></div>
      <div id="cats"></div>
    </div>
  </aside>
  <div class="mapcol">
    <div id="map"></div>
    <button id="details-btn"></button>
    <div id="drawer"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/map-features.js"></script>
<script src="data/regions.js"></script>
<script src="data/region-info.js"></script>
<script>
const D = window.MAP_DATA, R = window.REGIONS.regions;
const W = D.size.width, H = D.size.height;
const ll = (x, y) => [-y, x];                 // image px (y down) → CRS.Simple
const bounds = [[-H, 0], [0, W]];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const map = L.map('map', { crs: L.CRS.Simple, minZoom: -4.1, maxZoom: 1, zoomSnap: 0.25, attributionControl: false });
L.imageOverlay(D.localImage, bounds).addTo(map);
map.setMaxBounds(L.latLngBounds(bounds).pad(0.15));
map.setView([-3375, 2887.5], -3.13);

const Coords = L.Control.extend({ onAdd() { this.el = L.DomUtil.create('div', 'coords'); return this.el; } });
const coords = new Coords({ position: 'bottomright' }).addTo(map);
// Shrink icons when zoomed out so the overview stays readable
const sizeIcons = () => { const z = map.getZoom(); map.getContainer().style.setProperty('--poi', z <= -3 ? '50%' : z <= -2 ? '70%' : '100%'); };
map.on('zoomend', sizeIcons); sizeIcons();
map.on('mousemove', e => coords.el.textContent = `x ${e.latlng.lng.toFixed(0)}  y ${(-e.latlng.lat).toFixed(0)}`);

// ---------- State ----------
const selRegions = new Set();
const catOn = new Map();          // category -> bool
let selectedMarker = null;

// ---------- Regions ----------
map.createPane('veil').style.zIndex = 420;      // overlayPane (base image) is 400, markerPane is 600
map.createPane('regions').style.zIndex = 450;
const regionById = {};
for (const r of R) {
  const rings = r.polygons.map(p => p.map(ring => ring.map(([x, y]) => ll(x, y))));
  const opts = { pane: 'regions', color: r.color, fillColor: r.color, fillRule: 'evenodd' };
  r.glow = L.polygon(rings, { ...opts, className: 'rg-glow', weight: 9, fill: false, interactive: false }).addTo(map);
  r.fill = L.polygon(rings, { ...opts, className: 'rg-fill', weight: 1.6 }).addTo(map);
  r.outer = r.polygons.map(p => p[0].map(([x, y]) => ll(x, y)));
  r.bounds = r.fill.getBounds();
  r.fill.bindTooltip(r.name, { sticky: true, className: 'tip', direction: 'top', offset: [0, -8] });
  r.fill.on('mouseover', () => { r.hover = true; styleRegions(); });
  r.fill.on('mouseout', () => { r.hover = false; styleRegions(); });
  r.fill.on('click', e => toggleRegion(r.id, e.originalEvent.metaKey || e.originalEvent.ctrlKey || e.originalEvent.shiftKey, false));
  regionById[r.id] = r;
}
const veil = L.polygon([], { pane: 'veil', className: 'veil', stroke: false, fillColor: '#05070c', fillOpacity: 0, fillRule: 'evenodd', interactive: false }).addTo(map);

function styleRegions() {
  const filtering = selRegions.size > 0;
  for (const r of R) {
    const on = selRegions.has(r.id);
    let fill, line, glow;
    if (!filtering) { fill = r.hover ? .24 : .13; line = r.hover ? .95 : .6; glow = r.hover ? .55 : .22; }
    else if (on)    { fill = r.hover ? .30 : .24; line = 1;   glow = .75; }
    else            { fill = r.hover ? .10 : 0;   line = r.hover ? .5 : .12; glow = 0; }
    r.fill.setStyle({ fillOpacity: fill, opacity: line });
    r.glow.setStyle({ opacity: glow });
    if (r.label) r.label.getElement()?.querySelector('.region-label')?.classList.toggle('dim', filtering && !on);
  }
  // Dark veil over everything except the selected regions
  veil.setLatLngs(filtering
    ? [[[-H * 2, -W], [-H * 2, W * 2], [H, W * 2], [H, -W]], ...[...selRegions].flatMap(id => regionById[id].outer)]
    : []);
  veil.setStyle({ fillOpacity: filtering ? .45 : 0 });
}

function toggleRegion(id, multi, fly = true) {
  if (multi) selRegions.has(id) ? selRegions.delete(id) : selRegions.add(id);
  else if (selRegions.size === 1 && selRegions.has(id)) selRegions.clear();
  else { selRegions.clear(); selRegions.add(id); }
  refresh();
  if (fly && selRegions.size) {
    const b = [...selRegions].reduce((acc, i) => acc.extend(regionById[i].bounds), L.latLngBounds([]));
    map.flyToBounds(b, { padding: [30, 30], duration: 0.6 });
  }
}

// ---------- Markers ----------
const iconFor = (p) => L.divIcon({ className: 'poi', html: `<img src="${esc(p)}" alt="">`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14], tooltipAnchor: [0, -14] });
const cats = new Map();
const items = [];
for (const f of D.features) {
  const reg = regionById[f.region];
  if (f.kind === 'LABEL') {
    const r = R.find(r => r.name === f.title);
    const m = L.marker(ll(f.x, f.y), { interactive: false, keyboard: false,
      icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="region-label" style="--c:${r?.color ?? '#000'}">${esc(f.title)}</div>` }) }).addTo(map);
    if (r) r.label = m;
    continue;
  }
  if (!cats.has(f.category)) cats.set(f.category, { name: f.category, group: f.group, icon: f.localIcon, layer: L.layerGroup().addTo(map), items: [] });
  const c = cats.get(f.category);
  const m = L.marker(ll(f.x, f.y), { icon: iconFor(f.localIcon), riseOnHover: true, keyboard: false })
    .bindTooltip(`${esc(f.title)}${reg ? ` <small>· ${esc(reg.name)}</small>` : ''}`, { className: 'tip', direction: 'top' })
    .bindPopup(`<div class="pop"><b>${esc(f.title)}</b><div class="meta">${esc(f.category)}${reg ? ` · <i style="--c:${reg.color}"></i>${esc(reg.name)}` : ''}</div>` +
      (f.description ? `<p>${esc(f.description).replace(/\n/g, '<br>')}</p>` : '') +
      `<p><code>x ${f.x.toFixed(0)}, y ${f.y.toFixed(0)}</code></p></div>`);
  m.on('popupopen', () => { selectedMarker?.getElement()?.classList.remove('sel'); selectedMarker = m; m.getElement()?.classList.add('sel'); m.closeTooltip(); });
  m.on('popupclose', () => { m.getElement()?.classList.remove('sel'); if (selectedMarker === m) selectedMarker = null; });
  const it = { f, m, c, shown: false };
  c.items.push(it); items.push(it);
  catOn.set(f.category, true);
}
const visible = it => catOn.get(it.c.name) && (selRegions.size === 0 || selRegions.has(it.f.region));

// ---------- Sidebar: regions ----------
const regEl = document.getElementById('regions');
for (const r of R) {
  const b = document.createElement('button');
  b.className = 'reg'; b.style.setProperty('--c', r.color);
  b.innerHTML = `<i></i><span>${esc(r.name.replace(' National Park', ''))}</span><small>${items.filter(i => i.f.region === r.id).length}</small>`;
  b.title = 'Click to focus · ⌘/Ctrl/Shift-click to add';
  b.onclick = e => toggleRegion(r.id, e.metaKey || e.ctrlKey || e.shiftKey);
  b.onmouseenter = () => { r.hover = true; styleRegions(); };
  b.onmouseleave = () => { r.hover = false; styleRegions(); };
  r.btn = b; regEl.appendChild(b);
}
document.getElementById('regAll').onclick = () => { selRegions.clear(); refresh(); map.flyTo([-3375, 2887.5], -3.13, { duration: 0.6 }); };

// ---------- Sidebar: categories ----------
const catsEl = document.getElementById('cats');
const groups = {};
for (const c of cats.values()) (groups[c.group] ??= []).push(c);
for (const [g, list] of Object.entries(groups)) {
  const sec = document.createElement('div'); sec.className = 'group';
  sec.innerHTML = `<h3>${esc(g)}</h3>`;
  list.sort((a, b) => b.items.length - a.items.length);
  for (const c of list) {
    const lab = document.createElement('label'); lab.className = 'cat';
    lab.innerHTML = `<input type="checkbox" checked><img src="${esc(c.icon)}" alt=""><span>${esc(c.name)}</span><span class="n"></span>`;
    c.cb = lab.querySelector('input'); c.countEl = lab.querySelector('.n'); c.labelEl = lab;
    c.cb.addEventListener('change', () => { catOn.set(c.name, c.cb.checked); refresh(); });
    sec.appendChild(lab);
  }
  catsEl.appendChild(sec);
}
const setAll = on => { for (const c of cats.values()) { c.cb.checked = on; catOn.set(c.name, on); } refresh(); };
document.getElementById('all').onclick = () => setAll(true);
document.getElementById('none').onclick = () => setAll(false);

// ---------- Refresh ----------
function refresh() {
  for (const it of items) {
    const v = visible(it);
    if (v !== it.shown) { v ? it.c.layer.addLayer(it.m) : it.c.layer.removeLayer(it.m); it.shown = v; }
  }
  for (const c of cats.values()) {
    const n = c.items.filter(i => selRegions.size === 0 || selRegions.has(i.f.region)).length;
    c.countEl.textContent = n;
    c.labelEl.classList.toggle('empty', n === 0);
  }
  for (const r of R) r.btn.classList.toggle('on', selRegions.has(r.id));
  regEl.classList.toggle('filtering', selRegions.size > 0);
  styleRegions();
  renderDrawer();
}

// ---------- Region details drawer ----------
const drawer = document.getElementById('drawer'), detailsBtn = document.getElementById('details-btn');
const INFO = window.REGION_INFO || {};
// Which categories count as "key locations", in priority order
const KEY_CATS = ['Airport', 'WAiNK Landmarks', 'Race', 'Banks', 'Garage', 'Vehicle Mod Shop', 'Strip Club', 'Gun Store', 'Hospital', 'Police Station'];
let drawerOpen = true, drawerFor = null, onlyCat = null;
function renderDrawer() {
  const one = selRegions.size === 1 ? regionById[[...selRegions][0]] : null;
  if (!one) { drawer.classList.remove('open'); detailsBtn.classList.remove('show'); drawerFor = null; onlyCat = null; return; }
  if (drawerFor !== one.id) { drawerOpen = true; onlyCat = null; }
  drawerFor = one.id;
  const info = INFO[one.id] || {};
  drawer.style.setProperty('--c', one.color); detailsBtn.style.setProperty('--c', one.color);
  detailsBtn.textContent = `ⓘ ${one.name}`;
  detailsBtn.classList.toggle('show', !drawerOpen);
  drawer.classList.toggle('open', drawerOpen);
  if (!drawerOpen) return;
  const mine = items.filter(i => i.f.region === one.id);
  const byCat = {};
  for (const i of mine) (byCat[i.c.name] ??= []).push(i);
  const chips = Object.entries(byCat).sort((a, b) => b[1].length - a[1].length).map(([n, l]) =>
    `<button class="chip${onlyCat === n ? ' only' : ''}" data-cat="${esc(n)}" title="Show only ${esc(n)}"><img src="${esc(l[0].f.localIcon)}" alt=""><b>${l.length}</b> ${esc(n)}</button>`).join('');
  const generic = i => !i.f.title || i.f.title === i.c.name;
  const keys = mine.filter(i => KEY_CATS.includes(i.c.name) && !generic(i))
    .sort((a, b) => KEY_CATS.indexOf(a.c.name) - KEY_CATS.indexOf(b.c.name)).slice(0, 14);
  drawer.innerHTML = `<div class="dw">
    <button class="x" title="Hide details">×</button>
    <div>${info.postcard ? `<img class="pc" src="${esc(info.postcard)}" alt="${esc(one.name)} postcard">` : ''}</div>
    <div>
      <h2>${esc(one.name)}</h2>
      ${info.tagline ? `<div class="tag">“${esc(info.tagline)}”</div>` : ''}
      ${info.realWorld ? `<div class="rw">Inspired by ${esc(info.realWorld)}</div>` : ''}
      <ul class="sum">${(info.summary || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    </div>
    <div class="col3">
      <h4>${mine.length} locations</h4><div class="chips">${chips}</div>
      ${keys.length ? `<h4>Key locations</h4><div class="keys">${keys.map(i =>
        `<button data-id="${i.f.id}" title="${esc(i.c.name)}"><img src="${esc(i.f.localIcon)}" alt=""><span>${esc(i.f.title)}</span></button>`).join('')}</div>` : ''}
    </div></div>`;
  drawer.querySelector('.x').onclick = () => { drawerOpen = false; renderDrawer(); };
  drawer.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const n = b.dataset.cat;
    onlyCat = onlyCat === n ? null : n;
    for (const c of cats.values()) { const on = !onlyCat || c.name === onlyCat; c.cb.checked = on; catOn.set(c.name, on); }
    refresh();
  });
  drawer.querySelectorAll('.keys button').forEach(b => b.onclick = () => {
    const it = items.find(i => i.f.id === b.dataset.id);
    if (!catOn.get(it.c.name)) { it.c.cb.checked = true; catOn.set(it.c.name, true); refresh(); }
    map.flyTo(ll(it.f.x, it.f.y), Math.max(map.getZoom(), -1), { duration: 0.6 });
    setTimeout(() => it.m.openPopup(), 650);
  });
}
detailsBtn.onclick = () => { drawerOpen = true; renderDrawer(); };
drawer.addEventListener('transitionend', () => map.invalidateSize());
refresh();
// Deep link: index.html?region=vice-city
const qp = new URLSearchParams(location.search).get('region');
if (qp && regionById[qp]) toggleRegion(qp, false);

// ---------- Search ----------
const resEl = document.getElementById('results');
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  resEl.innerHTML = '';
  resEl.classList.toggle('on', q.length > 0);
  if (!q) return;
  const hits = items.filter(({ f }) => `${f.title} ${f.category} ${f.description ?? ''} ${regionById[f.region]?.name ?? ''}`.toLowerCase().includes(q)).slice(0, 60);
  if (!hits.length) { resEl.innerHTML = '<button disabled style="color:var(--muted)">No matches</button>'; return; }
  for (const h of hits) {
    const b = document.createElement('button');
    b.innerHTML = `<img src="${esc(h.f.localIcon)}" alt=""><span>${esc(h.f.title)}</span><small>${esc(regionById[h.f.region]?.name.replace(' National Park', '') ?? h.f.category)}</small>`;
    b.onclick = () => {
      if (!catOn.get(h.c.name)) { h.c.cb.checked = true; catOn.set(h.c.name, true); }
      if (selRegions.size && !selRegions.has(h.f.region)) selRegions.clear();
      refresh();
      map.flyTo(ll(h.f.x, h.f.y), Math.max(map.getZoom(), -1), { duration: 0.6 });
      setTimeout(() => h.m.openPopup(), 650);
    };
    resEl.appendChild(b);
  }
});
</script>
</body>
</html>
